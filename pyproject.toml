[project]
name = "jev-gramax"
version = "0.1.0"
description = "MCP server for agents working with a Gramax wiki, with Jev as the classifier"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "pyyaml>=6",
    "snowballstemmer>=2.2",
    "fastembed>=0.5",
]

[project.scripts]
jev-gramax-mcp = "jev_gramax.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_gramax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
